[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwood"
version = "0.0.1"
description = "A learning-focused quantitative research and paper-trading pipeline for US stocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["driftwood*"]
