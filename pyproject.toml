[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "driftwood"
version = "0.4.0"
description = "A learning-focused quantitative research and paper-trading pipeline for US stocks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "duckdb>=1.1",
    "yfinance>=0.2.50",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
cmake.source-dir = "cpp/sim"
wheel.packages = ["driftwood"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
notebook = [
    "matplotlib>=3.8",
]

[project.scripts]
driftwood = "driftwood.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "cmake-build-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The notebook inserts the repo root on sys.path before importing driftwood,
# so a checkout runs even when the kernel was not started from an editable install.
"notebooks/**/*.ipynb" = ["E402"]
