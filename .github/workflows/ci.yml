name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Install CMake and OpenMP on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          brew install libomp
          cmake --version

      - name: Lint and install
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m ruff check .

      - name: Build and import the C++ simulator when it exists
        shell: bash
        run: |
          if [ -f cpp/sim/CMakeLists.txt ]; then
            python -c "import driftwood._sim as sim; print(sim.__file__)"
          else
            echo "C++ execution simulator is added with that milestone; nothing to compile yet."
          fi

      - name: Test
        shell: bash
        run: python -m pytest -q
